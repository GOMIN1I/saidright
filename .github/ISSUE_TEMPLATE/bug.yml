name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste transcripts, recordings or API keys. Settings → Advanced → Copy diagnostics contains none of them.
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps, expected and actual result }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Diagnostics, description: Paste from Settings → Advanced → Copy diagnostics, render: text }
  - type: input
    id: mac
    attributes: { label: Mac and macOS version, placeholder: "MacBook Pro M3, macOS 26.1" }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Hotkey / permissions, Recording / microphone, Recognition, Text insertion, Editing (cloud), Language help, Modes, Capsule / UI, Localization, Installation, Other]
